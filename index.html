<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工特休紀錄系統 (含雲端同步與免登入查詢)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        th.sortable:hover { background-color: #e0e7ff; }

        /* Toast 動畫 */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

<!-- Toast 提示容器 -->
<div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2"></div>

<div class="max-w-7xl mx-auto">
    <header class="mb-8 bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
            <h1 class="text-3xl font-bold text-indigo-900 flex items-center mb-2">
                <i class="fas fa-cloud-check mr-3 text-indigo-600"></i> 特休雲端系統
            </h1>
            <div id="loginStatusInfo" class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full inline-block">
                未登入狀態
            </div>
        </div>
        
        <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
            <!-- 老師免登入查詢區 -->
            <div class="flex items-center gap-2 bg-indigo-50 p-2 rounded-lg border border-indigo-100 flex-grow md:flex-grow-0" id="teacherSearchArea">
                <i class="fas fa-search text-indigo-400 pl-2"></i>
                <input type="text" id="teacherQueryCode" placeholder="輸入您的專屬 ID..." class="bg-transparent border-none focus:ring-0 text-sm font-medium w-full md:w-40 text-indigo-900 outline-none">
                <button onclick="searchTeacherData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-bold shadow-sm transition whitespace-nowrap">
                    查詢
                </button>
            </div>
            
            <div class="h-10 w-px bg-gray-200 hidden md:block" id="dividerLine"></div>

            <!-- 園長管理登入區 -->
            <button id="loginBtn" onclick="loginWithGoogle()" class="bg-white border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-2 px-6 rounded-lg shadow-sm transition duration-200 flex items-center justify-center whitespace-nowrap">
                使用 Google 登入 (管理員)
            </button>
            
            <!-- 登入後的管理按鈕 -->
            <div id="adminControls" class="hidden flex gap-3">
                <button onclick="downloadExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center whitespace-nowrap">
                    <i class="fas fa-file-excel mr-2"></i> 下載總表
                </button>
                <button onclick="openEditModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center whitespace-nowrap">
                    <i class="fas fa-plus mr-2"></i> 新增員工
                </button>
                <button onclick="logout()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg transition duration-200 flex items-center whitespace-nowrap">
                    登出
                </button>
            </div>
            
            <!-- 查詢模式退出的按鈕 -->
            <button id="exitSearchBtn" onclick="exitSearchMode()" class="hidden bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg shadow transition duration-200 whitespace-nowrap">
                返回首頁
            </button>
        </div>
    </header>

    <main class="glass-panel rounded-xl overflow-hidden mb-8">
        <div class="overflow-x-auto relative min-h-[300px]">
            <!-- 載入中遮罩 -->
            <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-600 mb-3"></i>
                <div class="text-indigo-900 font-bold" id="loadingText">載入資料中...</div>
            </div>

            <table class="w-full text-left border-collapse min-w-[1000px]" id="employeeTable">
                <thead>
                    <tr class="bg-indigo-50 text-indigo-900 border-b border-indigo-100 select-none">
                        <th class="p-4 font-semibold cursor-pointer sortable transition" onclick="sortEmployees('name')">
                            員工姓名 <i class="fas fa-sort ml-1 text-indigo-300" id="sortIcon-name"></i>
                        </th>
                        <th class="p-4 font-semibold">到職日</th>
                        <th class="p-4 font-semibold">當前年資</th>
                        <th class="p-4 font-semibold">特休區間</th>
                        <th class="p-4 font-semibold text-center">總天數</th>
                        <th class="p-4 font-semibold text-center cursor-pointer sortable transition" onclick="sortEmployees('remain')">
                            已休/剩餘 <i class="fas fa-sort ml-1 text-indigo-300" id="sortIcon-remain"></i>
                        </th>
                        <!-- 唯讀模式隱藏的欄位 -->
                        <th class="p-4 font-semibold text-center admin-col">期末狀態</th>
                        <th class="p-4 font-semibold text-right admin-col">代金狀態</th>
                        
                        <th class="p-4 font-semibold text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="employeeList" class="divide-y divide-gray-100 bg-white"></tbody>
            </table>
            
            <div id="emptyState" class="hidden p-12 text-center text-gray-500">
                <div class="bg-gray-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-users text-3xl text-gray-400"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-700 mb-1" id="emptyTitle">尚無資料</h3>
                <p id="emptyDesc">請先使用 Google 登入或輸入查詢碼。</p>
            </div>
        </div>
    </main>
</div>

<!-- 新增/編輯員工 Modal -->
<div id="employeeModal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
        <div class="bg-indigo-600 p-4 text-white flex justify-between items-center">
            <h2 id="modalTitle" class="text-xl font-bold">員工基本資料</h2>
            <button onclick="closeModal('employeeModal')" class="text-indigo-200 hover:text-white transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        <form id="employeeForm" class="p-6 space-y-4">
            <input type="hidden" id="empId">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">員工姓名 <span class="text-red-500">*</span></label>
                <input type="text" id="empName" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">專屬查詢 ID (供老師免登入查詢用)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-id-badge"></i></span>
                    <input type="text" id="empQueryCode" class="w-full pl-10 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="例如：老師的工號或英文名">
                </div>
                <p class="text-xs text-gray-500 mt-1">留空則代表該老師無法自行查詢。</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">到職日 <span class="text-red-500">*</span></label>
                <input type="date" id="empHireDate" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="p-4 bg-red-50 rounded-lg border border-red-100">
                <label class="block text-sm font-bold text-red-700 mb-1"><i class="fas fa-user-slash mr-1"></i> 離職日 (若在職請留空)</label>
                <input type="date" id="empResignDate" class="w-full p-2 border border-red-300 rounded-lg focus:ring-2 focus:ring-red-500 bg-white outline-none">
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                <button type="button" onclick="closeModal('employeeModal')" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">取消</button>
                <button type="submit" class="px-4 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium shadow">儲存資料</button>
            </div>
        </form>
    </div>
</div>

<!-- 特休紀錄與結算 Modal -->
<div id="recordModal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden transform transition-all flex flex-col max-h-[95vh]">
        <div class="bg-teal-600 p-4 text-white flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold flex items-center" id="recordModalName">
                <i class="fas fa-file-signature mr-2 text-teal-200"></i> 特休紀錄
            </h2>
            <button onclick="closeModal('recordModal')" class="text-teal-200 hover:text-white transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <div class="bg-teal-50 px-6 py-3 border-b border-teal-100 flex flex-wrap justify-between items-center shrink-0 gap-3">
            <label class="font-bold text-teal-900 flex items-center whitespace-nowrap">
                <i class="fas fa-calendar-alt mr-2 text-teal-600"></i> 選擇檢視年度：
            </label>
            <select id="periodSelector" onchange="changeViewPeriod()" class="p-2 border border-teal-300 rounded-lg text-sm bg-white shadow-sm focus:ring-2 focus:ring-teal-500 grow max-w-sm font-medium text-gray-700 outline-none"></select>
        </div>

        <div class="p-6 overflow-y-auto grow bg-gray-50 flex flex-col md:flex-row gap-6">
            
            <!-- 左側/上半部：狀態區 (園長模式與老師模式長不一樣) -->
            <div class="w-full md:w-1/2 flex flex-col gap-6" id="recordLeftPanel">
                <!-- 天數圓餅概覽 -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center">
                        <div class="text-sm text-gray-500 mb-1 font-medium">總可休天數</div>
                        <div class="text-2xl font-bold text-gray-800" id="statTotal">0</div>
                        <div class="text-[10px] text-orange-600 mt-1 h-3" id="statCarryOverDisplay"></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-green-100 shadow-sm text-center">
                        <div class="text-sm text-green-600 mb-1 font-medium">剩餘天數</div>
                        <div class="text-2xl font-bold text-green-600" id="statRemain">0</div>
                        <div class="text-[10px] text-transparent mt-1 h-3" id="statRemainDetail">-</div>
                    </div>
                </div>

                <!-- 遞延設定卡片 -->
                <div class="p-5 border border-orange-200 bg-white rounded-xl shadow-sm relative overflow-hidden" id="deferralCard">
                    <div class="absolute top-0 right-0 p-4 opacity-5"><i class="fas fa-forward text-6xl text-orange-500"></i></div>
                    <div class="flex items-start justify-between relative z-10">
                        <div class="pr-4 w-full">
                            <h3 class="font-bold text-gray-800 text-lg mb-1" id="deferralCardTitle">遞延至下一年度</h3>
                            <div id="deferReadOnlyText" class="hidden mb-2 inline-block"></div>
                            <p class="text-sm text-gray-600 leading-relaxed" id="deferDesc"></p>
                            <div class="mt-3 inline-flex items-center text-xs font-medium bg-orange-50 text-orange-700 px-3 py-1.5 rounded-full border border-orange-100" id="deferralDeadlineBox">
                                <i class="fas fa-clock mr-1.5"></i> <span id="deferralDeadline"></span>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer mt-1 shrink-0" id="deferToggleWrapper">
                            <input type="checkbox" id="deferToggle" class="sr-only peer" onchange="toggleDeferral()">
                            <div class="w-14 h-7 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-orange-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-orange-500 shadow-inner"></div>
                        </label>
                    </div>
                </div>

                <!-- 結算薪資卡片 (僅園長可見) -->
                <div class="p-5 border border-indigo-200 bg-white rounded-xl shadow-sm relative admin-only-block" id="settlementCard">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                        <h3 class="font-bold text-gray-800 text-lg flex items-center">
                            <i class="fas fa-coins text-indigo-500 mr-2"></i> 期末結算紀錄
                        </h3>
                        <label class="relative inline-flex items-center cursor-pointer" id="settleToggleWrapper">
                            <input type="checkbox" id="settleToggle" class="sr-only peer" onchange="toggleSettlement()">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            <span class="ml-2 text-sm font-bold text-indigo-700" id="settleLabelText">標記已發放</span>
                        </label>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">本期計算基準月薪</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 font-medium">NT$</span>
                                <input type="number" id="monthlySalary" class="w-full pl-12 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-gray-50 outline-none" placeholder="例如: 36000" oninput="updateSalaryDisplay()" onchange="saveDataToCloud()">
                            </div>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 flex-1 text-center flex flex-col justify-center">
                                <div class="text-xs text-gray-500 mb-1 font-medium">應結算天數</div>
                                <div class="font-bold text-gray-800 text-lg" id="settleDaysDisplay">0 天</div>
                            </div>
                            <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-200 flex-[1.5] text-center" id="wageBox">
                                <div class="text-xs text-indigo-600 mb-1 font-medium" id="wageBoxTitle">應發代金總額估算</div>
                                <div class="font-bold text-2xl text-indigo-700" id="totalWageDisplay">$0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側/下半部：請假紀錄表 -->
            <div class="w-full md:w-1/2 bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col flex-grow h-full" id="recordRightPanel">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-gray-800 text-lg flex items-center">
                        <i class="fas fa-plane-departure text-teal-500 mr-2"></i> 請假明細 (<span class="text-blue-600 mx-1" id="statUsed">0</span>天)
                    </h3>
                </div>
                
                <!-- 新增請假表單 (僅園長) -->
                <form id="addLeaveForm" class="flex flex-col gap-2 mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200 admin-only-block">
                    <div class="flex gap-2 items-center">
                        <input type="date" id="leaveStartDate" required class="p-2 border border-gray-300 rounded text-sm w-32 focus:ring-2 outline-none">
                        <span class="text-gray-400 text-xs">至</span>
                        <input type="date" id="leaveEndDate" class="p-2 border border-gray-300 rounded text-sm w-32 focus:ring-2 outline-none" title="結束日(單日留空)">
                    </div>
                    <div class="flex gap-2 items-center mt-1">
                        <select id="leaveHours" class="p-2 border border-gray-300 rounded text-sm grow outline-none">
                            <option value="8">全天 (1天)</option>
                            <option value="4">半天 (0.5天)</option>
                        </select>
                        <button type="submit" class="bg-teal-600 text-white px-4 py-2 rounded text-sm hover:bg-teal-700 font-medium">新增</button>
                    </div>
                </form>

                <div class="flex-grow border border-gray-200 rounded-lg overflow-hidden flex flex-col bg-gray-50" style="min-height: 250px;">
                    <div class="overflow-y-auto grow p-0">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-gray-100 sticky top-0 shadow-sm text-gray-600">
                                <tr>
                                    <th class="p-3 font-medium border-b">日期</th>
                                    <th class="p-3 font-medium border-b">天數</th>
                                    <th class="p-3 font-medium border-b text-right admin-col">刪除</th>
                                </tr>
                            </thead>
                            <tbody id="leaveRecordsList" class="divide-y divide-gray-200 bg-white"></tbody>
                        </table>
                        <div id="emptyLeave" class="text-center p-8 text-gray-400 text-sm hidden">
                            <i class="fas fa-mug-hot text-2xl mb-2 opacity-50"></i><br>本期無請假紀錄
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
        <div class="p-4 bg-white border-t border-gray-200 flex justify-end shrink-0">
            <button onclick="closeModal('recordModal')" class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 transition shadow font-medium">關閉視窗</button>
        </div>
    </div>
</div>

<!-- 刪除確認 Modal -->
<div id="confirmModal" class="fixed inset-0 bg-gray-900/50 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center transform transition-all">
        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
        <h3 class="text-xl font-bold text-gray-800 mb-2">確定要刪除嗎？</h3>
        <p class="text-gray-600 mb-6 text-sm">此操作將移除該員工的所有紀錄，無法還原。</p>
        <div class="flex justify-center gap-3">
            <button onclick="closeModal('confirmModal')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition">取消</button>
            <button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium shadow transition">確定刪除</button>
        </div>
    </div>
</div>

<script type="module">
    // 🔥 將這裡換成你從 Firebase 後台取得的 Config 🔥
    const firebaseConfig = {
        apiKey: "AIzaSyCPNcw6zmIUzhkgtK_9AuJGPJcoeWnAIuk",
        authDomain: "sdp-leavesystem.firebaseapp.com",
        projectId: "sdp-leavesystem",
        storageBucket: "sdp-leavesystem.firebasestorage.app",
        messagingSenderId: "189204961551",
        appId: "1:189204961551:web:58fb5265dd6635523a467a"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // 系統變數
    let employees = [];
    let currentUser = null;
    let currentViewEmpId = null;
    let currentViewPeriodId = null;
    let currentSort = { key: 'default', direction: 'asc' };
    
    // ⭐️ 核心安全變數：決定是否為唯讀模式 (老師查詢)
    window.isReadOnlyMode = true; 

    // 自訂 Toast 提示工具
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = type === 'success' ? 'bg-green-100 border-green-300 text-green-800' : 'bg-red-100 border-red-300 text-red-800';
        const icon = type === 'success' ? '<i class="fas fa-check-circle mr-2 text-green-600"></i>' : '<i class="fas fa-exclamation-circle mr-2 text-red-600"></i>';
        
        toast.className = `flex items-center p-3 mb-2 rounded-lg border shadow-sm toast-enter ${colors}`;
        toast.innerHTML = `${icon} <span class="font-medium text-sm">${message}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.replace('toast-enter', 'toast-exit');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // --- Firebase Auth 登入管理 ---
    window.loginWithGoogle = () => {
        setLoading(true, "登入中...");
        signInWithPopup(auth, provider).catch(error => {
            console.error("登入錯誤:", error);
            if (error.code === 'auth/unauthorized-domain') {
                showToast(`登入失敗：請將此網域加入 Firebase 授權網域白名單！`, 'error');
                alert("【重要提示】\n您正在使用的預覽環境網域未授權。\n請到 Firebase 後台 -> Authentication -> 設定 -> 已授權網域\n新增網域： scf.usercontent.goog");

    async function loadDataFromCloud() {
        if (!currentUser) return;
        setLoading(true, "同步雲端資料中...");
        try {
            const docRef = doc(db, 'users', currentUser.uid, 'system', 'data');
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                employees = snap.data().employees || [];
            } else {
                employees = [];
            }
            updateUIAfterAuth();
        } catch(e) {
            showToast("讀取資料失敗", 'error');
            console.error(e);
        }
        setLoading(false);
    }

    window.saveDataToCloud = async () => {
        if (window.isReadOnlyMode || !currentUser) return;
        try {
            // 儲存至管理員私有區
            const docRef = doc(db, 'users', currentUser.uid, 'system', 'data');
            await setDoc(docRef, { employees });
            
            // 同步至免登入公共查詢區 (Public Leaves)
            const batch = writeBatch(db);
            employees.forEach(emp => {
                if(emp.queryCode && emp.queryCode.trim() !== '') {
                    const pubRef = doc(db, 'public_leaves', emp.queryCode.trim());
                    batch.set(pubRef, { data: emp, updatedBy: currentUser.uid });
                }
            });
            await batch.commit();
            
            renderTable();
        } catch(e) {
            showToast("存檔失敗", 'error');
            console.error(e);
        }
    };

    function formatDate(dateObj) {
        return dateObj.toISOString().split('T')[0];
    }
    function isDateInPeriod(dateStr, startStr, endStr) {
        const d = new Date(dateStr); d.setHours(0,0,0,0);
        const s = new Date(startStr); s.setHours(0,0,0,0);
        const e = new Date(endStr); e.setHours(23,59,59,999);
        return d >= s && d <= e;
    }

    function getPeriods(emp) {
        // 【防呆機制】：過濾掉損壞或不完整的測試資料
        if (!emp || !emp.hireDate) return []; 
        
        const hireDate = new Date(emp.hireDate);
        if (isNaN(hireDate)) return []; // 確保日期格式正確
        
        const today = new Date();
        const resignDate = emp.resignDate ? new Date(emp.resignDate) : null;
        
        let maxYears = today.getFullYear() - hireDate.getFullYear() + 2; 
        if (resignDate) maxYears = resignDate.getFullYear() - hireDate.getFullYear() + 1;
        if (maxYears < 1) maxYears = 1;

        const periods = [];
        const halfYear = new Date(hireDate); halfYear.setMonth(halfYear.getMonth() + 6);
        const oneYear = new Date(hireDate); oneYear.setFullYear(oneYear.getFullYear() + 1);
        let p05End = new Date(oneYear.getTime() - 86400000);
        
        if (!resignDate || halfYear <= resignDate) {
            if (resignDate && p05End > resignDate) p05End = resignDate;
            periods.push({
                id: '0.5', name: '滿半年 (第0.5年)',
                start: formatDate(halfYear), end: formatDate(p05End),
                baseDays: 3
            });
        }

        for(let i = 1; i <= maxYears; i++) {
            const pStart = new Date(hireDate); pStart.setFullYear(pStart.getFullYear() + i);
            if (resignDate && pStart > resignDate) break; 
            
            let pEnd = new Date(pStart); pEnd.setFullYear(pEnd.getFullYear() + 1); pEnd.setDate(pEnd.getDate() - 1);
            if (resignDate && pEnd > resignDate) pEnd = resignDate;

            let days = 0;
            if (i === 1) days = 7; else if (i === 2) days = 10;
            else if (i >= 3 && i < 5) days = 14; else if (i >= 5 && i < 10) days = 15;
            else if (i >= 10) days = Math.min(30, 15 + (i - 9));

            periods.push({
                id: i.toString(), name: `滿 ${i} 年`,
                start: formatDate(pStart), end: formatDate(pEnd),
                baseDays: days
            });
        }

        let previousRemainBase = 0;
        periods.forEach((p, index) => {
            if (!emp.periodSettings) emp.periodSettings = {};
            const settings = emp.periodSettings[p.id] || {};
            const isLastPeriodAndResigned = resignDate && (index === periods.length - 1);
            
            p.isDeferred = isLastPeriodAndResigned ? false : !!settings.isDeferred;
            p.isSettled = !!settings.isSettled; 
            p.salary = settings.salary || 0;
            p.isResignedPeriod = isLastPeriodAndResigned;
            
            p.carryOverDays = previousRemainBase;
            p.totalAvailable = p.baseDays + p.carryOverDays;

            if(!emp.leaves) emp.leaves = [];
            emp.leaves.forEach(l => {
                if (!l.periodId && isDateInPeriod(l.date, p.start, p.end)) l.periodId = p.id;
            });

            p.leaves = emp.leaves.filter(l => l.periodId === p.id);
            p.usedDays = p.leaves.reduce((sum, l) => sum + parseFloat(l.hours)/8, 0);
            
            p.remainCarryOver = Math.max(0, p.carryOverDays - p.usedDays);
            const usedBaseDays = Math.max(0, p.usedDays - p.carryOverDays);
            p.remainBase = Math.max(0, p.baseDays - usedBaseDays);
            p.remainDays = p.remainCarryOver + p.remainBase;
            
            p.settleDays = p.isDeferred ? p.remainCarryOver : p.remainDays;

            let deadlineDate = new Date(p.end);
            if (p.isDeferred) deadlineDate.setFullYear(deadlineDate.getFullYear() + 1);
            if (isLastPeriodAndResigned) deadlineDate = resignDate; 
            
            p.deadline = formatDate(deadlineDate);
            previousRemainBase = p.isDeferred ? p.remainBase : 0;
        });
        return periods;
    }

    function getCurrentPeriod(periods, resignDate) {
        if(periods.length === 0) return null;
        const targetDate = resignDate ? resignDate : formatDate(new Date());
        let current = periods.find(p => targetDate >= p.start && targetDate <= p.end);
        if (!current) current = [...periods].reverse().find(p => targetDate >= p.start);
        return current || periods[0];
    }

    window.sortEmployees = (key) => {
        if (currentSort.key === key) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.key = key; currentSort.direction = 'asc';
        }
        renderTable();
    };

    function renderTable() {
        const tbody = document.getElementById('employeeList');
        const emptyState = document.getElementById('emptyState');
        const table = document.getElementById('employeeTable');
        tbody.innerHTML = '';
        
        ['name', 'remain'].forEach(k => {
            const i = document.getElementById(`sortIcon-${k}`);
            if(i) i.className = currentSort.key === k ? `fas fa-sort-${currentSort.direction==='asc'?'up':'down'} ml-1 text-indigo-600` : 'fas fa-sort ml-1 text-indigo-300';
        });

        if (employees.length === 0) {
            emptyState.classList.remove('hidden'); table.classList.add('hidden'); return;
        }
        emptyState.classList.add('hidden'); table.classList.remove('hidden');

        // 【防呆機制】：過濾掉無效資料
        let displayData = employees.map(emp => {
            if (!emp || !emp.hireDate) return null;
            const periods = getPeriods(emp);
            const current = getCurrentPeriod(periods, emp.resignDate);
            return { emp, current };
        }).filter(d => d !== null && d.current != null);

        if (currentSort.key === 'name') {
            displayData.sort((a, b) => {
                let res = a.emp.name.localeCompare(b.emp.name, 'zh-TW');
                return currentSort.direction === 'asc' ? res : -res;
            });
        } else if (currentSort.key === 'remain') {
            displayData.sort((a, b) => currentSort.direction === 'asc' ? a.current.remainDays - b.current.remainDays : b.current.remainDays - a.current.remainDays);
        }

        displayData.forEach(data => {
            const { emp, current } = data;
            const isExpired = new Date() > new Date(current.deadline);
            const dailyWage = current.salary > 0 ? Math.round(current.salary / 30) : 0;
            const settleAmount = Math.round(current.settleDays * dailyWage);
            const isResigned = !!emp.resignDate;

            let statusHtml = '';
            if (current.remainDays === 0) statusHtml = '<span class="px-2 py-1 bg-gray-100 text-gray-500 rounded text-xs border">無剩餘</span>';
            else if (isResigned) statusHtml = '<span class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-bold border border-red-200">離職結算</span>';
            else if (current.isDeferred) statusHtml = '<span class="px-2 py-1 bg-orange-100 text-orange-700 rounded text-xs font-bold border border-orange-200">啟用遞延</span>';
            else statusHtml = '<span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs font-bold border">未遞延</span>';

            let wageHtml = '';
            if (current.settleDays === 0) wageHtml = '<span class="text-gray-400 text-sm">無須發放</span>';
            else if (current.isSettled) wageHtml = `<span class="text-green-600 font-bold">$${settleAmount.toLocaleString()}</span> <div class="text-xs text-green-500">已發放</div>`;
            else wageHtml = `<span class="text-indigo-700 font-bold">$${settleAmount.toLocaleString()}</span> <div class="text-xs ${isExpired||isResigned ? 'text-red-500' : 'text-gray-400'}">待結算</div>`;

            // 唯讀模式下的操作按鈕 (大大的查看明細) vs 管理員模式按鈕
            const actionBtns = window.isReadOnlyMode 
                ? `<button onclick="openRecordModal('${emp.id}')" class="w-full text-indigo-700 bg-indigo-50 hover:bg-indigo-100 py-2 rounded-lg font-bold transition flex items-center justify-center"><i class="fas fa-search mr-2"></i>查看明細</button>`
                : `<button onclick="openRecordModal('${emp.id}')" class="text-teal-600 hover:text-teal-800 bg-teal-50 p-2.5 rounded transition mr-1" title="紀錄與結算"><i class="fas fa-file-signature"></i></button>
                   <button onclick="openEditModal('${emp.id}')" class="text-blue-600 hover:text-blue-800 bg-blue-50 p-2.5 rounded transition mr-1" title="編輯資料"><i class="fas fa-pencil-alt"></i></button>
                   <button onclick="deleteEmployee('${emp.id}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2.5 rounded transition" title="刪除"><i class="fas fa-trash"></i></button>`;

            const tr = document.createElement('tr');
            tr.className = "hover:bg-indigo-50/30 transition";
            tr.innerHTML = `
                <td class="p-4 border-b border-gray-100 font-bold text-gray-800">
                    ${emp.name} ${isResigned ? `<div class="text-xs text-red-500 mt-1"><i class="fas fa-ban"></i> 已離職</div>` : ''}
                </td>
                <td class="p-4 border-b border-gray-100 text-gray-600 text-sm">${emp.hireDate}</td>
                <td class="p-4 border-b border-gray-100 text-indigo-700 font-medium">${current.name}</td>
                <td class="p-4 border-b border-gray-100 text-sm">
                    <div class="text-gray-800">${current.start} ~ ${current.end}</div>
                    <div class="text-xs ${isExpired||isResigned ? 'text-red-500 font-bold' : 'text-gray-500'} mt-1">期限: ${current.deadline}</div>
                </td>
                <td class="p-4 border-b border-gray-100 text-center font-bold text-gray-700 text-lg">${current.totalAvailable}</td>
                <td class="p-4 border-b border-gray-100 text-center text-sm">
                    <span class="text-blue-600">${current.usedDays}</span> / 
                    <span class="${current.remainDays > 0 ? 'text-green-600 font-bold text-lg' : 'text-gray-400'}">${current.remainDays}</span>
                </td>
                <td class="p-4 border-b border-gray-100 text-center admin-col ${window.isReadOnlyMode?'hidden':''}">${statusHtml}</td>
                <td class="p-4 border-b border-gray-100 text-right admin-col ${window.isReadOnlyMode?'hidden':''}">${wageHtml}</td>
                <td class="p-4 border-b border-gray-100 text-center">${actionBtns}</td>
            `;
            tbody.appendChild(tr);
        });
    }

        const queryCode = document.getElementById('empQueryCode').value;

    window.openRecordModal = (empId) => {
        currentViewEmpId = empId;
        const emp = employees.find(e => e.id === empId);
        document.getElementById('recordModalName').innerHTML = `<i class="fas fa-file-signature mr-2 text-teal-200"></i> ${emp.name} 的紀錄`;

        const current = getCurrentPeriod(periods, emp.resignDate);

    window.changeViewPeriod = () => {

    function renderModalData() {
        const emp = employees.find(e => e.id === currentViewEmpId);
        const periods = getPeriods(emp);
        const p = periods.find(per => per.id === currentViewPeriodId);
        if(!p) return;

        document.getElementById('statTotal').innerText = p.totalAvailable;
        document.getElementById('statCarryOverDisplay').innerText = p.carryOverDays > 0 ? `(含上期遞延 ${p.carryOverDays} 天)` : '';
        document.getElementById('statUsed').innerText = p.usedDays;
        document.getElementById('statRemain').innerText = p.remainDays;
        
        const remainDetail = document.getElementById('statRemainDetail');
        if (p.remainDays > 0 && p.remainCarryOver > 0) {
            remainDetail.innerText = `(強制結算剩${p.remainCarryOver}天/可遞延剩${p.remainBase}天)`;
            remainDetail.classList.replace('text-transparent', 'text-gray-500');
        } else {
            remainDetail.innerText = '-';
            remainDetail.classList.replace('text-gray-500', 'text-transparent');
        }
        
        const deferToggleWrapper = document.getElementById('deferToggleWrapper');
        const deferReadOnlyText = document.getElementById('deferReadOnlyText');
        const deferDesc = document.getElementById('deferDesc');
        const settlementCard = document.getElementById('settlementCard');
        
        // ⭐️ 最核心的顯示邏輯區分 (唯讀老師 vs 園長)
        if (window.isReadOnlyMode) {
            // 老師模式：純看狀態，隱藏開關與薪資
            deferToggleWrapper.classList.add('hidden');
            deferReadOnlyText.classList.remove('hidden');
            settlementCard.classList.add('hidden');
            document.getElementById('deferralCardTitle').innerText = "期末結算與遞延狀態";
            
            if (p.isResignedPeriod) {
                deferReadOnlyText.innerText = "離職強制結算";
                deferReadOnlyText.className = "text-sm font-bold px-3 py-1 rounded-full border bg-red-50 text-red-700 border-red-200 mb-2 inline-block";
                deferDesc.innerHTML = `<span class="text-red-600 font-bold">因離職依法不得遞延，須全數結算。</span>`;
            } else if (p.isSettled) {
                deferReadOnlyText.innerText = "已結算並發放薪資";
                deferReadOnlyText.className = "text-sm font-bold px-3 py-1 rounded-full border bg-green-50 text-green-700 border-green-200 mb-2 inline-block";
                deferDesc.innerHTML = `<span class="text-green-700 font-bold">本年度未休畢之特休，已由園所完成結算並發放代金。</span>`;
            } else if (p.isDeferred) {
                deferReadOnlyText.innerText = "已啟用遞延至下一年度";
                deferReadOnlyText.className = "text-sm font-bold px-3 py-1 rounded-full border bg-orange-50 text-orange-700 border-orange-200 mb-2 inline-block";
                deferDesc.innerHTML = `本期未休畢之特休已遞延至下一年度。`;
            } else {
                deferReadOnlyText.innerText = "尚未設定 (待結算/遞延)";
                deferReadOnlyText.className = "text-sm font-bold px-3 py-1 rounded-full border bg-gray-50 text-gray-600 border-gray-200 mb-2 inline-block";
                deferDesc.innerHTML = `尚未啟用遞延，到期未休畢依法應結算工資。`;
            }
        } else {
            // 園長模式：完整設定權限
            deferToggleWrapper.classList.remove('hidden');
            deferReadOnlyText.classList.add('hidden');
            settlementCard.classList.remove('hidden');
            document.getElementById('deferralCardTitle').innerText = "遞延至下一年度";
            document.getElementById('deferToggle').checked = p.isDeferred;
            
            if (p.isResignedPeriod) {
                document.getElementById('deferToggle').disabled = true;
                deferToggleWrapper.classList.add('opacity-50', 'cursor-not-allowed');
                deferDesc.innerHTML = `<span class="text-red-600 font-bold">員工已離職，依法未休完特休須全數結算。</span>`;
                document.getElementById('settleDaysDisplay').innerHTML = `${p.settleDays} 天 <div class="text-xs text-red-500 mt-1">(離職依法結算)</div>`;
            } else {
                document.getElementById('deferToggle').disabled = false;
                deferToggleWrapper.classList.remove('opacity-50', 'cursor-not-allowed');
                deferDesc.innerHTML = `啟用後，本期【新增特休 <span class="font-bold text-orange-600">${p.remainBase}天</span>】將移至下期。`;
                document.getElementById('settleDaysDisplay').innerHTML = p.isDeferred && p.remainCarryOver > 0 
                    ? `<span class="text-red-500">${p.settleDays} 天</span><div class="text-xs text-gray-500 mt-1">(逾期強制結算)</div>` 
                    : `${p.settleDays} 天`;
            }

            document.getElementById('settleToggle').checked = p.isSettled;
            const settleToggleWrapper = document.getElementById('settleToggleWrapper');
            if (p.settleDays === 0) {
                document.getElementById('settleToggle').disabled = true;
                settleToggleWrapper.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                document.getElementById('settleToggle').disabled = false;
                settleToggleWrapper.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            const wageBoxTitle = document.getElementById('wageBoxTitle');
            const wageBox = document.getElementById('wageBox');
            if (p.isSettled && p.settleDays > 0) {
                document.getElementById('settleLabelText').innerText = '已發放';
                wageBoxTitle.innerText = '已發放代金';
                wageBox.className = "bg-green-50 p-3 rounded-lg border border-green-300 flex-[1.5] text-center";
                wageBoxTitle.className = "text-xs text-green-700 mb-1 font-medium";
                document.getElementById('totalWageDisplay').className = "font-bold text-2xl text-green-700";
            } else {
                document.getElementById('settleLabelText').innerText = '標記發放';
                wageBoxTitle.innerText = '應發代金估算';
                wageBox.className = "bg-indigo-50 p-3 rounded-lg border border-indigo-200 flex-[1.5] text-center";
                wageBoxTitle.className = "text-xs text-indigo-600 mb-1 font-medium";
                document.getElementById('totalWageDisplay').className = "font-bold text-2xl text-indigo-700";
            }
            document.getElementById('monthlySalary').value = p.salary || '';
            calculateWageDisplay(p);
        }
        
        document.getElementById('deferralDeadline').innerText = `最後期限：${p.deadline}`;
        renderLeaveList(p.leaves);
    }

    window.toggleDeferral = () => {
        if(window.isReadOnlyMode) return;
        const emp = employees.find(e => e.id === currentViewEmpId);
        if(!emp.periodSettings[currentViewPeriodId]) emp.periodSettings[currentViewPeriodId] = {};
        emp.periodSettings[currentViewPeriodId].isDeferred = document.getElementById('deferToggle').checked;
        emp.periodSettings[currentViewPeriodId].isSettled = false; 
        saveDataToCloud(); renderModalData(); 
    };

    window.toggleSettlement = () => {
        if(window.isReadOnlyMode) return;
        const emp = employees.find(e => e.id === currentViewEmpId);
        if(!emp.periodSettings[currentViewPeriodId]) emp.periodSettings[currentViewPeriodId] = {};
        emp.periodSettings[currentViewPeriodId].isSettled = document.getElementById('settleToggle').checked;
        saveDataToCloud(); renderModalData();
    };

    document.getElementById('addLeaveForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if(window.isReadOnlyMode) return;
        
        const startDateStr = document.getElementById('leaveStartDate').value;
        let endDateStr = document.getElementById('leaveEndDate').value || startDateStr; 
        const hours = document.getElementById('leaveHours').value;

        const emp = employees.find(e => e.id === currentViewEmpId);
        const p = getPeriods(emp).find(per => per.id === currentViewPeriodId);
        
        if (p.isSettled) { showToast("此期特休已結算發放，無法新增紀錄！", 'error'); return; }
        if (new Date(startDateStr) > new Date(endDateStr)) { showToast("開始日期不能晚於結束日期！", 'error'); return; }

        let currentDate = new Date(startDateStr);
        const endDateObj = new Date(endDateStr);
        let targetDates = [];

        while (currentDate <= endDateObj) {
            targetDates.push(formatDate(currentDate));
            currentDate.setDate(currentDate.getDate() + 1);
        }

        const startD = new Date(p.start); startD.setHours(0,0,0,0);
        const endD = new Date(p.deadline); endD.setHours(23,59,59,999);
        for (let d of targetDates) {
            const checkD = new Date(d); checkD.setHours(0,0,0,0);
            if (checkD < startD || checkD > endD) { showToast(`日期 ${d} 不在有效期間內！`, 'error'); return; }
            if (emp.leaves.some(l => l.date === d)) { showToast(`日期 ${d} 已經有紀錄！`, 'error'); return; }
        }

        const requestedDays = targetDates.length * (parseFloat(hours) / 8);
        if (p.remainDays < requestedDays) { showToast(`天數不足！需要 ${requestedDays} 天，僅剩 ${p.remainDays} 天。`, 'error'); return; }
        
        targetDates.forEach(d => {
            emp.leaves.push({ id: Date.now().toString() + Math.random().toString().substring(2,6), periodId: currentViewPeriodId, date: d, hours: hours });
        });

        emp.leaves.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveDataToCloud();
        
        document.getElementById('leaveStartDate').value = ''; 
        document.getElementById('leaveEndDate').value = ''; 
        renderModalData();
        showToast("已新增請假紀錄");
    });

    window.deleteLeave = (leaveId) => {
        if(window.isReadOnlyMode) return;
        const emp = employees.find(e => e.id === currentViewEmpId);
        emp.leaves = emp.leaves.filter(l => l.id !== leaveId);
        saveDataToCloud();
        renderModalData();
        showToast("已刪除該筆請假紀錄");
    };

    function renderLeaveList(leaves) {
        const tbody = document.getElementById('leaveRecordsList');
        const emptyDiv = document.getElementById('emptyLeave');
        tbody.innerHTML = '';
        if(leaves.length === 0) {
            emptyDiv.classList.remove('hidden');
        } else {
            emptyDiv.classList.add('hidden');
            leaves.forEach(l => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 border-b border-gray-100 transition";
                const daysStr = l.hours == 8 ? '<span class="bg-blue-100 text-blue-800 py-0.5 px-2 rounded text-xs font-bold">1 天</span>' : '<span class="bg-purple-100 text-purple-800 py-0.5 px-2 rounded text-xs font-bold">0.5 天</span>';
                tr.innerHTML = `
                    <td class="p-3 text-gray-700 font-medium">${l.date}</td><td class="p-3">${daysStr}</td>
                    <td class="p-3 text-right admin-col ${window.isReadOnlyMode?'hidden':''}">
                        <button onclick="deleteLeave('${l.id}')" class="text-red-400 hover:text-red-600 bg-red-50 p-1.5 rounded"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    window.updateSalaryDisplay = () => {
        if(window.isReadOnlyMode) return;
        const emp = employees.find(e => e.id === currentViewEmpId);
        const salary = parseInt(document.getElementById('monthlySalary').value) || 0;
        const p = getPeriods(emp).find(per => per.id === currentViewPeriodId);
        p.salary = salary;
        calculateWageDisplay(p);
    };

    function calculateWageDisplay(p) {
        const dailyWage = p.salary > 0 ? Math.round(p.salary / 30) : 0;
        document.getElementById('totalWageDisplay').innerText = `$${Math.round(p.settleDays * dailyWage).toLocaleString()}`;
    }

    window.downloadExcel = () => {
        if (employees.length === 0) { showToast("沒有資料可下載！", 'error'); return; }
        
        let csv = "\uFEFF員工姓名,在職狀態,離職日,到職日,查詢ID,備註說明,特休年度,特休區間(起),特休區間(迄),最後期限,總天數,已休,剩餘天數,遞延/結算狀態,應結算天數\n";
        employees.forEach(emp => {
            const periods = getPeriods(emp);
            let status = emp.resignDate ? '已離職' : '在職';
            const safeRemarks = emp.remarks ? emp.remarks.replace(/"/g, '""') : '';
            
            periods.forEach(p => {
                let deferStatus = '';
                if (p.isResignedPeriod) deferStatus = '離職強制結算';
                else if (p.remainDays === 0) deferStatus = '無剩餘';
                else if (p.isDeferred) deferStatus = '啟用遞延';
                else deferStatus = '未遞延(應結算)';
                
                const row = [
                    `"${emp.name}"`, `"${status}"`, `"${emp.resignDate || ''}"`, `"${emp.hireDate}"`, `"${emp.queryCode||''}"`, `"${safeRemarks}"`,
                    `"${p.name}"`, `"${p.start}"`, `"${p.end}"`, `"${p.deadline}"`,
                    p.totalAvailable, p.usedDays, p.remainDays, `"${deferStatus}"`, p.settleDays
                ];
                csv += row.join(",") + "\n";
            });
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        const d = new Date();
        link.download = `員工特休總表_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.csv`;
        link.click();
    };
    
    // 初始化 UI 狀態
    updateUIAfterAuth();
</script>
</body>
</html>
